name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run sample scoring
        run: python src/scoring.py samples/opportunity-intake.json
      - name: Evaluate synthetic extraction
        run: python src/evaluate_extraction.py samples/expected-extraction.json samples/sample-ai-output.json

